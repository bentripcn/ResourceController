<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">资源整理器</title>
  <desc id="logo-desc">一个包含图片卡片和标签的现代文件夹图标</desc>
  <defs>
    <linearGradient id="surface" x1="72" y1="42" x2="444" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <linearGradient id="folder" x1="86" y1="170" x2="426" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#438AF5"/>
      <stop offset="1" stop-color="#5D5FEF"/>
    </linearGradient>
    <linearGradient id="folder-highlight" x1="100" y1="192" x2="410" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78B4FF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#6671F6" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="photo" x1="151" y1="205" x2="358" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7E7FF"/>
      <stop offset=".55" stop-color="#A5B9FF"/>
      <stop offset="1" stop-color="#D6C7FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4966B8" flood-opacity=".19"/>
    </filter>
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#43589C" flood-opacity=".18"/>
    </filter>
    <clipPath id="photo-clip">
      <rect x="151" y="204" width="210" height="136" rx="18"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#surface)"/>
  <circle cx="382" cy="119" r="68" fill="#DDE8FF" opacity=".68"/>
  <circle cx="121" cy="402" r="80" fill="#E8DEFF" opacity=".48"/>

  <!-- Organized media cards -->
  <g filter="url(#card-shadow)" transform="rotate(-8 267 186)">
    <rect x="181" y="99" width="177" height="124" rx="22" fill="#FFFFFF"/>
    <rect x="199" y="117" width="141" height="82" rx="14" fill="#EFF4FF"/>
    <circle cx="221" cy="139" r="9" fill="#FFBF69"/>
    <path d="M203 184l30-29 24 22 19-17 33 24h-106z" fill="#A7BDFB"/>
  </g>
  <g filter="url(#card-shadow)" transform="rotate(6 260 197)">
    <rect x="143" y="121" width="190" height="132" rx="23" fill="#FFFFFF"/>
    <rect x="162" y="140" width="152" height="91" rx="15" fill="#F3F6FF"/>
    <circle cx="185" cy="163" r="9" fill="#78D6C1"/>
    <path d="M166 216l35-35 26 23 16-15 32 27H166z" fill="#B3C8FF"/>
  </g>

  <!-- Folder body -->
  <g filter="url(#shadow)">
    <path d="M82 188c0-13 10-23 23-23h87l27 27h189c13 0 23 10 23 23v164c0 18-14 32-32 32H114c-18 0-32-14-32-32V188z" fill="url(#folder)"/>
    <path d="M82 209c0-13 10-23 23-23h303c13 0 23 10 23 23v18H82v-18z" fill="#6EA5FB" opacity=".72"/>
    <path d="M83 236h348v118c0 18-14 32-32 32H114c-18 0-32-14-32-32V236z" fill="url(#folder-highlight)" opacity=".86"/>
  </g>

  <!-- Featured image card -->
  <g filter="url(#card-shadow)">
    <rect x="133" y="186" width="246" height="177" rx="27" fill="#FFFFFF"/>
    <rect x="151" y="204" width="210" height="136" rx="18" fill="url(#photo)"/>
    <g clip-path="url(#photo-clip)">
      <circle cx="313" cy="236" r="28" fill="#FFF3B1" opacity=".9"/>
      <path d="M143 329l56-60 39 36 36-33 93 73H143z" fill="#7D8FE4" opacity=".82"/>
      <path d="M143 348l64-43 30 22 48-35 85 56H143z" fill="#5C71CF" opacity=".85"/>
    </g>
    <circle cx="177" cy="229" r="7" fill="#FFFFFF" opacity=".9"/>
    <circle cx="199" cy="229" r="7" fill="#FFFFFF" opacity=".62"/>
    <circle cx="221" cy="229" r="7" fill="#FFFFFF" opacity=".42"/>
  </g>

  <!-- Tag accents -->
  <g filter="url(#card-shadow)">
    <rect x="318" y="350" width="95" height="43" rx="21.5" fill="#FFFFFF"/>
    <rect x="333" y="362" width="28" height="18" rx="9" fill="#FFB36B"/>
    <rect x="369" y="362" width="28" height="18" rx="9" fill="#75D7C1"/>
  </g>
</svg>
